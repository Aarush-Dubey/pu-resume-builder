<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PU Resume Builder</title>
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor" aria-label="Resume details form">
        <div class="editor-head">
          <div>
            <p class="eyebrow">PU Resume Builder</p>
            <h1>Fill details → resume ready</h1>
          </div>
          <div class="actions">
            <button id="loadSample" type="button">Sample</button>
            <button id="clearForm" type="button">Clear</button>
          </div>
        </div>

        <form id="resumeForm">
          <fieldset>
            <legend>Basic</legend>
            <div class="grid two">
              <label>Full name <input name="name" value="FIRSTNAME LASTNAME" /></label>
              <label>Degree <input name="degree" value="Degree Name" /></label>
              <label>Grad year <input name="year" value="2026/7" /></label>
              <label>CGPA <input name="cgpa" value="Y.XX" /></label>
              <label>Email <input name="email" value="f2022XXXX@pilani.bits-pilani.ac.in" /></label>
              <label>Mobile <input name="mobile" value="+91-XXXXXXXXXX" /></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>Images</legend>
            <div class="grid two image-controls">
              <label>Profile photo <input id="photoUpload" type="file" accept="image/*" /></label>
              <label>BITS / logo <input id="logoUpload" type="file" accept="image/*" /></label>
              <button id="resetPhoto" type="button">Reset photo</button>
              <button id="resetLogo" type="button">Reset logo</button>
            </div>
          </fieldset>

          <fieldset>
            <legend>Resume Style</legend>
            <div id="styleControls" class="style-controls"></div>
          </fieldset>

          <fieldset>
            <legend>Academic Details</legend>
            <div id="academics" class="repeat-list"></div>
            <button class="add-btn" type="button" data-add="academics">+ Add academic row</button>
          </fieldset>

          <fieldset>
            <legend>Internships / Experience</legend>
            <div id="experience" class="repeat-list"></div>
            <button class="add-btn" type="button" data-add="experience">+ Add experience</button>
          </fieldset>

          <fieldset>
            <legend>Position Of Responsibility</legend>
            <div id="responsibility" class="repeat-list"></div>
            <button class="add-btn" type="button" data-add="responsibility">+ Add role</button>
          </fieldset>

          <fieldset>
            <legend>Projects / Achievements / Publications</legend>
            <div id="projects" class="repeat-list"></div>
            <button class="add-btn" type="button" data-add="projects">+ Add project</button>
          </fieldset>

          <fieldset>
            <legend>Extra Curricular</legend>
            <div id="activities" class="repeat-list"></div>
            <button class="add-btn" type="button" data-add="activities">+ Add activity</button>
          </fieldset>
        </form>
      </section>

      <section class="preview-wrap" aria-label="Resume preview">
        <div class="preview-toolbar">
          <button id="boldSelection" type="button" title="Bold selected resume text"><b>B</b></button>
          <button id="italicSelection" type="button" title="Italic selected resume text"><i>I</i></button>
          <button id="clearSelectionStyle" type="button">Clear text style</button>
          <button id="downloadDoc" type="button">Download .doc</button>
          <button id="printResume" type="button">Print / PDF</button>
        </div>
        <article id="resume" class="resume" contenteditable="true" aria-label="Editable resume preview"></article>
      </section>
    </main>

    <script src="app.js?v=13"></script>
  </body>
</html>
